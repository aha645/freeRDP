name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos-x86_64
            shell: bash
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-22.04
            platform: linux-x86_64
            shell: bash
          - runner: windows-2022
            platform: windows-x86_64
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build perl python3 pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev \
            libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libudev-dev
      - name: macOS development packages
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkgconf
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Pin CMake for Unix builds
        if: runner.os != 'Windows'
        run: python -m pip install cmake==3.31.6
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build dependencies and client, package and smoke test
        shell: ${{ matrix.shell }}
        run: bash scripts/build.sh
      - name: Verify SDK reuse from a different install path
        shell: ${{ matrix.shell }}
        run: |
          mkdir -p .build-reuse/install
          tar xzf "dist/freerdp-deps-${{ matrix.platform }}.tar.gz" --strip-components=1 -C .build-reuse/install
          BUILD_ROOT="$PWD/.build-reuse" USE_PREBUILT_DEPS=1 bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: freerdp-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
