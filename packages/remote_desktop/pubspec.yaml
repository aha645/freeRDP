name: remote_desktop
description: Flutter 원격 데스크톱(RDP) 플러그인. FreeRDP 세션과 화면 위젯을 제공합니다.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  remote_desktop_android:
    path: ../remote_desktop_android
  remote_desktop_ffi:
    path: ../remote_desktop_ffi
  remote_desktop_platform_interface:
    path: ../remote_desktop_platform_interface

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: remote_desktop_android
